<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NerdPowered: power bolt wearing nerd glasses -->
  <rect width="64" height="64" rx="16" fill="#12161b"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#2a323d" stroke-width="2"/>
  <path d="M35 6 L13 37 H29 L26 58 L51 26 H35 Z" fill="#ffc53d"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- slim light edge so the black frames read on the dark tile -->
    <g fill="none" stroke="#e9eef3" stroke-width="5">
      <rect x="9" y="21" width="20" height="14" rx="4"/>
      <rect x="35" y="21" width="20" height="14" rx="4"/>
      <path d="M29 26 Q32 22.5 35 26"/>
      <path d="M9 25 H5.5 M55 25 H58.5"/>
    </g>
    <!-- black nerd frames with tinted lenses -->
    <g fill="#4fd8ff" fill-opacity="0.28" stroke="#0b0d10" stroke-width="3.5">
      <rect x="9" y="21" width="20" height="14" rx="4"/>
      <rect x="35" y="21" width="20" height="14" rx="4"/>
    </g>
    <g fill="none" stroke="#0b0d10" stroke-width="3.5">
      <path d="M29 26 Q32 22.5 35 26"/>
      <path d="M9 25 H5.5 M55 25 H58.5"/>
    </g>
    <!-- lens glints -->
    <path d="M13.5 29.5 L17 25 M39.5 29.5 L43 25" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.75"/>
  </g>
</svg>
